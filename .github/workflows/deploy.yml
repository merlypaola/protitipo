name: Deploy DidactikApp

on:
  push:
    branches:
      - main

concurrency:
  group: didactikapp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci
      - name: Verificar variables Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL vacía"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "VITE_SUPABASE_PUBLISHABLE_KEY vacía"; exit 1; }

          echo "Supabase URL configurada"
          echo "Supabase publishable key configurada"
      - name: Compilar proyecto
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verificar build
        run: |
          echo "Contenido generado:"
          find dist -maxdepth 3 -type f -print
          test -f dist/index.html

      - name: Desplegar a producción
        run: |
          rsync -rv --delete \
            dist/ \
            /var/www/didactikapp.grandlife-roleplay.com/public_html/
